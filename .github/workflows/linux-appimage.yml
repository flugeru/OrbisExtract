name: Linux AppImage

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'vendor/LibOrbisPkg/**'
      - 'scripts/publish-linux.sh'
      - 'scripts/build-appimage.sh'
      - 'packaging/**'
      - '.github/workflows/linux-appimage.yml'
      - '*.sln'
      - 'Directory.*'

permissions:
  contents: read

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore OrbisExtract.sln

      - name: Run automated tests
        run: dotnet test OrbisExtract.sln --no-restore --configuration Release

      - name: Publish Linux x64
        run: bash scripts/publish-linux.sh

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root "$HOME/appimagetool"

      - name: Build AppImage
        run: APPIMAGETOOL="$HOME/appimagetool/AppRun" bash scripts/build-appimage.sh

      - name: Verify AppImage
        run: |
          test -f artifacts/OrbisExtract-x86_64.AppImage
          ls -lh artifacts/OrbisExtract-x86_64.AppImage
          file artifacts/OrbisExtract-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbisextract-linux-appimage
          path: artifacts/OrbisExtract-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
