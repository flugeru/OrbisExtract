name: OrbisExtract — Signed Play bundle
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'New versionCode, above every previous GitHub and Play build'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: orbisextract-play-release
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install toolchain
        run: |
          dotnet workload install android
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Run tests
        run: |
          python3 tests/check_android_updates.py
          dotnet test OrbisExtract.sln -c Release
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_PASSWORD"
          umask 077
          mkdir -p "$RUNNER_TEMP/play-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-signing/upload.jks"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/play-signing/password.txt"
      - name: Build signed AAB
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/play-signing/upload.jks
          ANDROID_UPLOAD_PASSWORD_FILE: ${{ runner.temp }}/play-signing/password.txt
          ANDROID_UPLOAD_ALIAS: orbisextract-upload
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: bash scripts/publish-play.sh
      - name: Validate bundle
        run: |
          BUNDLETOOL="$(find "$DOTNET_ROOT/packs" -name bundletool.jar -print -quit)"
          AAB="$(find artifacts/play -name '*-Signed.aab' -print -quit)"
          test -f "$BUNDLETOOL"
          java -jar "$BUNDLETOOL" validate --bundle="$AAB"
          java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB" > artifacts/play/manifest.xml
          java -jar "$BUNDLETOOL" dump config --bundle="$AAB" > artifacts/play/bundle-config.json
          python3 scripts/verify-play-bundle.py "$AAB"
      - uses: actions/upload-artifact@v7
        with:
          name: OrbisExtract-Play-AAB
          path: |
            artifacts/play/*-Signed.aab
            artifacts/play/manifest.xml
            artifacts/play/bundle-config.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove upload key
        if: always()
        run: rm -rf "$RUNNER_TEMP/play-signing"
