name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run core and extraction tests
        run: dotnet test OrbisExtract.sln -c Release
      - name: Build desktop app
        run: dotnet build src/OrbisExtract.App/OrbisExtract.App.Desktop/OrbisExtract.App.Desktop.csproj -c Release
      - name: Check Android update configuration
        if: runner.os == 'Linux'
        run: python3 tests/check_android_updates.py
