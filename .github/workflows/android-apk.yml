name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'vendor/LibOrbisPkg/**'
      - 'scripts/publish-android.sh'
      - 'scripts/publish-windows.ps1'
      - '.github/workflows/android-apk.yml'
      - '*.sln'
      - 'Directory.*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK packages
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Clean Android build outputs
        run: |
          rm -rf src/OrbisExtract.App/OrbisExtract.App.Android/bin
          rm -rf src/OrbisExtract.App/OrbisExtract.App.Android/obj
          rm -rf artifacts/android
          mkdir -p artifacts/android

      - name: Restore solution and Android project
        run: |
          dotnet restore OrbisExtract.sln
          dotnet restore src/OrbisExtract.App/OrbisExtract.App.Android/OrbisExtract.App.Android.csproj -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"

      - name: Run automated tests
        run: dotnet test OrbisExtract.sln --no-restore --configuration Release

      - name: Verify Android assets
        run: test -f src/OrbisExtract.App/OrbisExtract.App.Android/obj/project.assets.json

      - name: Publish APK
        run: >-
          dotnet publish
          src/OrbisExtract.App/OrbisExtract.App.Android/OrbisExtract.App.Android.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormat=apk
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -o artifacts/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbisextract-android-apk
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows EXE
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution and desktop project
        run: |
          dotnet restore OrbisExtract.sln
          dotnet restore src/OrbisExtract.App/OrbisExtract.App.Desktop/OrbisExtract.App.Desktop.csproj -r win-x64

      - name: Run automated tests
        run: dotnet test OrbisExtract.sln --no-restore --configuration Release

      - name: Publish Windows EXE
        run: >-
          dotnet publish
          src/OrbisExtract.App/OrbisExtract.App.Desktop/OrbisExtract.App.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o artifacts/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbisextract-windows-exe
          path: artifacts/windows/**
          if-no-files-found: error
          retention-days: 14
