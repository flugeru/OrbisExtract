name: OrbisExtract — Build all platforms

on:
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'docs/release-*.md'
      - 'src/**'
      - 'vendor/LibOrbisPkg/**'
      - 'scripts/publish-android.sh'
      - 'scripts/publish-windows.ps1'
      - 'scripts/create-windows-icon.ps1'
      - 'packaging/**'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/linux-appimage.yml'
      - '*.sln'
      - 'Directory.*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: orbisextract-development-apk-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Verify Android SDK packages
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Use supplied square Android icon
        run: |
          test -f OrbisExtract-square.png
          cp OrbisExtract-square.png src/OrbisExtract.App/OrbisExtract.App.Android/Icon.png
          file src/OrbisExtract.App/OrbisExtract.App.Android/Icon.png

      - name: Clean Android build outputs
        run: |
          rm -rf src/OrbisExtract.App/OrbisExtract.App.Android/bin
          rm -rf src/OrbisExtract.App/OrbisExtract.App.Android/obj
          rm -rf artifacts/android
          mkdir -p artifacts/android

      - name: Restore solution and Android project
        run: |
          dotnet restore OrbisExtract.sln
          dotnet restore src/OrbisExtract.App/OrbisExtract.App.Android/OrbisExtract.App.Android.csproj -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"

      - name: Run automated tests
        run: |
          python3 tests/check_android_updates.py
          dotnet test OrbisExtract.sln --no-restore --configuration Release

      - name: Verify Android assets
        run: test -f src/OrbisExtract.App/OrbisExtract.App.Android/obj/project.assets.json

      - name: Restore signing key from repository Secret
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_SIGNING_KEYSTORE_BASE64; refusing to generate a different signing key."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.local/share/orbisextract-signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$HOME/.local/share/orbisextract-signing/development.jks"
          keytool -list -keystore "$HOME/.local/share/orbisextract-signing/development.jks" \
            -alias androiddebugkey -storepass android >/dev/null
          echo "APK_VERSION_CODE=$((1040000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Publish signed development APK
        run: >-
          dotnet publish
          src/OrbisExtract.App/OrbisExtract.App.Android/OrbisExtract.App.Android.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormat=apk
          -p:ApplicationVersion=${{ env.APK_VERSION_CODE }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$HOME/.local/share/orbisextract-signing/development.jks"
          -p:AndroidSigningKeyAlias=androiddebugkey
          -p:AndroidSigningKeyPass=android
          -p:AndroidSigningStorePass=android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AndroidUseLatestPlatformSdk=true
          -p:AndroidUseLatestBuildTools=true
          -o artifacts/android

      - name: Validate and package installable APK
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="artifacts/android/OrbisExtract.App.Android-Signed.apk"
          if [ ! -f "$SIGNED" ]; then
            SIGNED="$(find artifacts/android -maxdepth 1 -type f -name '*-Signed.apk' -print -quit)"
          fi
          test -n "$SIGNED" && test -f "$SIGNED"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee artifacts/android/signing-certificate.txt
          keytool -exportcert -keystore "$HOME/.local/share/orbisextract-signing/development.jks" \
            -alias androiddebugkey -storepass android -file artifacts/android/signing-certificate.der
          fingerprint="$(sha256sum artifacts/android/signing-certificate.der | cut -d ' ' -f 1)"
          grep -Fqi "certificate SHA-256 digest: $fingerprint" artifacts/android/signing-certificate.txt
          "$AAPT" dump badging "$SIGNED" | tee artifacts/android/package-info.txt
          grep -q "package: name='com.tatsuya.orbisextract'" artifacts/android/package-info.txt
          grep -q "versionCode='$APK_VERSION_CODE'" artifacts/android/package-info.txt
          grep -q "sdkVersion:'24'" artifacts/android/package-info.txt
          grep -q "targetSdkVersion:'36'" artifacts/android/package-info.txt
          mkdir -p artifacts/release
          cp "$SIGNED" artifacts/release/OrbisExtract.apk
          cp artifacts/android/signing-certificate.txt artifacts/release/signing-certificate.txt
          cp artifacts/android/package-info.txt artifacts/release/package-info.txt
          "$APKSIGNER" verify artifacts/release/OrbisExtract.apk
          "$AAPT" dump badging artifacts/release/OrbisExtract.apk >/dev/null
          ls -lh artifacts/release/OrbisExtract.apk

      - name: Upload installable APK only
        uses: actions/upload-artifact@v7
        with:
          name: OrbisExtract-Android-APK
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove runner signing key
        if: always()
        shell: bash
        run: rm -f "$HOME/.local/share/orbisextract-signing/development.jks"

  build-windows:
    name: Build Windows EXE
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Use supplied transparent Windows icon
        shell: pwsh
        run: |
          Copy-Item OrbisExtract-transparent.ico packaging/windows/orbisextract.ico -Force
          Copy-Item OrbisExtract-transparent.png packaging/linux/orbisextract.png -Force
          if (-not (Test-Path packaging/windows/orbisextract.ico)) { throw "Ícone ICO transparente ausente." }

      - name: Restore solution and desktop project
        run: |
          dotnet restore OrbisExtract.sln
          dotnet restore src/OrbisExtract.App/OrbisExtract.App.Desktop/OrbisExtract.App.Desktop.csproj -r win-x64

      - name: Run automated tests
        run: dotnet test OrbisExtract.sln --no-restore --configuration Release

      - name: Publish Windows EXE
        run: >-
          dotnet publish
          src/OrbisExtract.App/OrbisExtract.App.Desktop/OrbisExtract.App.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o artifacts/windows

      - name: Generate branded installer image
        shell: pwsh
        run: |
          & "packaging/windows/generate-wizard-image.ps1"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "packaging\windows\orbisextract.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou com código $LASTEXITCODE" }

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-Item artifacts/installer/*.exe
          Write-Output ("Instalador: " + $setup.Name + " (" + [math]::Round($setup.Length/1MB,1) + " MB)")
          if ($setup.Length -lt 1MB) { throw "Instalador suspeito (pequeno demais)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: orbisextract-windows-setup
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: orbisextract-windows-exe
          path: artifacts/windows/**
          if-no-files-found: error
          retention-days: 14

  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Use supplied transparent Linux icon
        run: |
          cp OrbisExtract-transparent.png packaging/linux/orbisextract.png
          file packaging/linux/orbisextract.png

      - name: Restore solution
        run: dotnet restore OrbisExtract.sln

      - name: Run automated tests
        run: dotnet test OrbisExtract.sln --no-restore --configuration Release

      - name: Publish Linux x64
        run: bash scripts/publish-linux.sh

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root "$HOME/appimagetool"

      - name: Build AppImage
        run: APPIMAGETOOL="$HOME/appimagetool/AppRun" VERSION=1.0.4 bash scripts/build-appimage.sh

      - name: Verify AppImage
        run: |
          test -f artifacts/OrbisExtract-x86_64.AppImage
          ls -lh artifacts/OrbisExtract-x86_64.AppImage
          file artifacts/OrbisExtract-x86_64.AppImage
          ./artifacts/OrbisExtract-x86_64.AppImage --appimage-extract
          test -x squashfs-root/AppRun
          test -f squashfs-root/orbisextract.desktop
          test -f squashfs-root/orbisextract.png
          test -x squashfs-root/usr/bin/OrbisExtract.App.Desktop
          head -n 3 squashfs-root/AppRun
          rm -rf squashfs-root

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: orbisextract-linux-appimage
          path: artifacts/OrbisExtract-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
