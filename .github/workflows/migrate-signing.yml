name: Migrate existing Android signing key
on:
  push:
    paths: ['.github/workflows/migrate-signing.yml']
permissions:
  contents: read
jobs:
  export-encrypted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/orbisextract-signing
          key: orbisextract-development-signing-v1
          fail-on-cache-miss: true
      - name: Encrypt existing key for repository Secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sealed-box"
          "$RUNNER_TEMP/sealed-box/bin/pip" -q install PyNaCl
          "$RUNNER_TEMP/sealed-box/bin/python" - <<'PY'
          import base64
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          key = Path.home() / '.local/share/orbisextract-signing/development.jks'
          encrypted = SealedBox(PublicKey(base64.b64decode('wQlHf+42jm1RQgoL5TKfNlYTSwBKp8TkRWY1nlCgwmM='))).encrypt(base64.b64encode(key.read_bytes()))
          Path('sealed-key.txt').write_text(base64.b64encode(encrypted).decode(), encoding='ascii')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-signing-secret
          path: sealed-key.txt
          retention-days: 1
